services:
  postgres:
    image: postgres:16-alpine
    container_name: labreserve-db
    environment:
      POSTGRES_DB: labreserve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - labreserve-data:/var/lib/postgresql/data

volumes:
  labreserve-data:
